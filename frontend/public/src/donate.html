<!DOCTYPE html>
    <html lang="en">
        <head>
            <title>Donate - Peggy Beatrice Foundation</title>
            <link rel="stylesheet" href="./style/main.css">
            <link rel="stylesheet" href="./style/donate.css">

            <script src="./script/script.js"></script>
            <script src="./script/donation_script.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
            <script async src="https://js.stripe.com/v3/buy-button.js"></script>
            
            <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
            <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
            <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
            <link rel="manifest" href="/favicon/site.webmanifest">
        </head>
        <body>
            <header>
                <div id="logo-container" class="content-parent">
                    <a href="/">
                        <div id="logo-image">
                        </div>
                    </a>
                    <div id="logo-text-parent" class="content-parent column-parent">
                        <div id="logo-text-top">
                            <a href="/">
                                Peggy Beatrice
                            </a>
                        </div>
                        <div id="logo-text-bttm">
                            <a href="/">Foundation</a>
                        </div>
                    </div>
                </div>
                <div id="header-actions">
                    <div>Donate</div>
                    <div id="night-mode">
                    </div>
                    <div id="menu-container">
                        <button title="toggle navigation" id="menu-button"></button>
                    </div>                    
                </div>
            </header>
            <div id="image-with-caption" class="content-parent column-parent" style="position: relative;">
                <h1>
                    Donate
                </h1>
            </div>
            <div id="donations" class="content-parent column-parent unrestricted-column">
                <div class="offset-child right-offset-child donation-program">
                    <div class="offset-content-grandchild left-offset-grandchild content-parent column-parent">
                        <div class="program-media media">
                        </div>
                        <div class="program-title-container program-title-container-left">
                            <p>
                                Peggy Beatrice Foundation
                            </p>
                        </div>

                        <div class="program-action-bar-left">
                            <div class="program-action">
                                <a class="donation" href="https://buy.stripe.com/00w14mh1OgdlcTx8hj6kg05" target="_blank">$250</a>
                            </div>
                            <div class="program-action">
                                <a class="donation" href="https://donate.stripe.com/aFa5kC5j68KT8Dh1SV6kg03" target="_blank">$100</a>
                            </div>
                            <div class="program-action">
                                <a class="donation" href="https://buy.stripe.com/9B65kCeTGbX5dXB4136kg04" target="_blank">$50</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <a title="contact us" id="quick-action" class="icon" href="./contact"></a>
            <footer class="content-parent column-parent">
                <div class="content-parent">
                    <h4>Links</h4>
                </div>
                <div class="content-parent">
                    <a href="./contact">Contact Us</a>
                </div>
                <div class="content-parent">
                    <a href="./gallery">Gallery</a>
                </div>
                <div class="content-parent">
                    <a href="./volunteer">Volunteer Registration</a>
                </div>
                <div class="content-parent">
                    <a href="./donate">Donate</a>
                </div>
                <div class="content-parent">
                    <h4>Contact Info</h4>
                </div>
                <div class="content-parent">
                    <p>(818) - 795 - 7139</p>
                </div>
                <div class="content-parent">
                    <p>info@peggybeatricefoundation.org</p>
                </div>
                <div id="socials-container" class="content-parent">
                    <a href="https://www.instagram.com/peggybeatricefoundation/" target="_blank">
                        <div id="insta" class="social-icon"></div>
                    </a>
                    <a href="https://www.facebook.com/peggybeatricefoundation" target="_blank">
                        <div id="facebook" class="social-icon"></div>
                    </a>
                    <a href="https://x.com/peggybeatrice" target="_blank">
                        <div id="twitter" class="social-icon"></div>
                    </a>
                </div>
            </footer>
            <!--
            CONDITIONAL RENDERS
            -->
            <div id="options-container" class="content-parent">
                <div class="floating-container content-parent">
                    <a href="/">
                        <img src="../icons/icons8-home.svg" class="menu-icons">
                        Home
                    </a>
                </div>
                <div class="floating-container content-parent">
                    <a href="/about">
                        <img src="../icons/icons8-about.svg" class="menu-icons">
                        About
                    </a>
                </div>                
                <div class="floating-container content-parent">
                    <a href="/gallery">
                        <img src="../icons/icons8-image-gallery-100.png" class="menu-icons">
                        Gallery
                    </a>
                </div>
                <div class="floating-container content-parent">
                    <a href="/contact">
                        <img src="../icons/icons8-talk-100.png" class="menu-icons">
                        Contact
                    </a>
                </div> 
                <div class="floating-container content-parent">
                    <a href="/programs">
                        <img src="../icons/icons8-construction-worker-100.png" class="menu-icons">
                        Programs
                    </a>
                </div>  
                <div class="floating-container content-parent">
                    <a href="/donate">
                        <img src="../icons/icons8-donate-100.png" class="menu-icons">
                        Donate
                    </a>
                </div>   
            </div>
            <div id="notification-modal" class="content-parent column-parent">
                <h1></h1>
                <h2></h2>
                <button id="notification-confirmation" type="button">Okay</button>
            </div>
            <div id="backdrop"></div>
